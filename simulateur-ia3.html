  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

this._expEl = el; }, style: { position: 'relative' } }, [guide, search, filters, h('div', { key: 'secs' }, content), overlay]);\n  }\n  centerPanel() {\n    const w = this._expEl, p = this._pwEl; if (!w || !p) return;\n    const wr = w.getBoundingClientRect(), ph = p.offsetHeight, vh = window.innerHeight || document.documentElement.clientHeight;\n    let y = ph > vh - 16 ? 8 - wr.top : (vh - ph) / 2 - wr.top;\n    y = Math.max(0, Math.min(y, w.offsetHeight - ph));\n    if (Math.abs(y - this.state.py) > 1) this.setState({ py: Math.round(y) });\n  }\n\n  renderVals() {\n    const T = this.T();\n    return { eyebrow: T.eyebrow, title: T.title, lang: this.state.lang, onLang: e => this.setState({ lang: e.target.value }), body: this.state.started ? this.renderBoard(T) : this.renderWelcome(T), disclaimer: T.disc };\n  }\n}\n\nconst DATA = {\n  fr: {\n    eyebrow: 'Simulateur pédagogique · glossaire',\n    title: 'Les mots de l’IA, décodés',\n    disc: 'Simulateur pédagogique : il illustre des notions et simplifie volontairement le fonctionnement réel d’une IA.',\n    welcome: { intro: 'Bonjour ! On entend sans cesse ces mots à propos de l’IA. Cliquez sur chacun : il ouvre un petit simulateur pour le comprendre en le manipulant.', cta: 'Explorer les mots →' },\n    guideIntro: 'Cliquez sur un mot : j’ouvre un mini-simulateur au-dessus pour que vous le testiez vous-même.',\n    robotLine: 'Bip boup… Vous m’avez démasqué : je suis un LLM déguisé en Einstein. Je devine juste le mot suivant, mais très bien. 😉',\n    panelKicker: 'Mini-simulateur',\n    groups: { all: { label: 'Tout', sub: '' }, bases: { label: 'Les bases', sub: 'de quoi une IA est faite' }, regler: { label: 'Régler le modèle', sub: 'ce qui pilote ses réponses' }, paysage: { label: 'Le paysage', sub: 'marques, applis et usages' }, autres: { label: 'Les types de modèles', sub: 'LLM et autres approches de l’IA' } },\n    searchPh: 'Rechercher un mot…', noResult: 'Aucun terme pour',\n    tryLbl: 'tester', resetLbl: 'Réinitialiser', synLbl: 'Synthèse · tout relier',\n    simpleLbl: 'En clair', simple: {\n      biais: ['Le principe|Le biais est le seuil d’un neurone : le signal reçu doit le dépasser pour que le neurone s’allume.', 'Où est-il sur le neurone ?|Le poids est posé sur chaque lien qui arrive. Le biais, lui, est posé sur le neurone lui-même : un biais par neurone.', 'Poids et paramètres|Le biais est l’autre type de paramètre, avec le poids. Paramètres = poids + biais.', 'L’entraînement|Comme les poids, les biais sont réglés pendant l’entraînement, jusqu’à ce que chaque neurone s’allume au bon moment.'],\n      token: ['Le problème|Un ordinateur ne comprend que les nombres, pas les mots. Pour lui, « chat » n’est qu’une suite de lettres sans signification.', 'La solution|L’IA coupe le texte en tokens : un mot court, une ponctuation ou un morceau de mot long devient un token. En moyenne, un token représente 3 caractères (3 octets) en français, contre 4 en anglais.\\nComment l’IA se souvient-elle d’un token ? Chaque token du vocabulaire de l’IA a un numéro d’identification unique, son ID, défini avant l’entraînement : les mots deviennent ainsi des nombres.', 'Et après|Pendant l’entraînement, l’IA organise tout son dictionnaire sur une carte, en rapprochant les mots de sens proche ou liés logiquement. La position de chaque ID sur cette carte s’appelle son embedding. C’est à partir de là que l’IA analyse les liens entre les mots et choisit le mot suivant.', 'Ce que ça change|Tout se compte en tokens : la longueur de texte que l’IA peut lire d’un coup, sa vitesse, et ce que vous payez.\\nLe français est donc légèrement plus cher et plus lent à traiter pour l’IA que l’anglais.'],\n      temperature: ['Le constat|Pour chaque mot, l’IA a plusieurs candidats, plus ou moins probables.', 'Le réglage|Basse, elle prend toujours le plus sûr. Haute, elle ose des mots rares.', 'En pratique|Basse pour un contrat ou un calcul. Haute pour chercher des idées.'],\n      prompt: ['Le problème|L’IA ne sait rien de vous ni de votre besoin.', 'La solution|Le prompt lui donne tout : un rôle, un exemple, le format voulu.', 'Le résultat|Plus le prompt est précis, plus la réponse tombe juste.'],\n      fenetre: ['Le principe|À chaque message, l’IA relit toute la conversation.', 'La limite|Sa mémoire a une taille maximale : la fenêtre. Quand elle est pleine, le début est oublié.', 'La conséquence|Si « Rome » était sorti de la fenêtre, elle ne pourrait plus vous répondre.'],\n      parametre: ['Le principe|Les paramètres sont des milliards de petits nombres. C’est là que le modèle garde ce qu’il a appris : la langue, les faits fréquents, les liens entre idées, les manières d’écrire.', 'Comment ils apprennent|Au départ, ils sont réglés au hasard. Le modèle devine un mot, on mesure son erreur, et chaque nombre bouge un tout petit peu. Répété des milliards de fois, ce réglage devient du savoir.', 'Comment c’est rangé|Pas un fait par case : le savoir est réparti sur tous les nombres, comme les pixels d’une photo : un pixel seul ne montre rien, c’est l’ensemble qui forme l’image. Les textes eux-mêmes ne sont pas gardés.', 'Et les poids ?|Un poids = un paramètre : la force d’un lien entre deux neurones. Les autres paramètres sont les biais, un petit nombre par neurone qui règle à partir de quand il s’allume. Paramètres = poids + biais.', 'Plus il y en a|Plus il retient de nuances et de faits rares. GPT-3 en avait 175 milliards. Pour GPT-6 Astra (septembre 2026), OpenAI n’a pas publié le chiffre : les estimations vont de 5 000 à 10 000 milliards. Mais plus il y en a, plus c’est cher à faire tourner.'],\n      reseau: ['Entrée (input)|Ce que le réseau reçoit. Ici : des indices vus sur la photo.', 'Neurone|Un mini-calcul. Il reçoit les indices, mais ne les écoute pas tous autant : certains comptent plus que d’autres, c’est leur poids (trait épais = indice important). Il fait le total. Si ce total dépasse son seuil, il s’allume. Ce seuil s’appelle le biais.', 'Poids et biais|Ce sont les deux types de paramètres. Le poids est posé sur chaque lien et dit si un signal arrive fort ou faible. Le biais est posé sur le neurone lui-même et règle à partir de quand il s’allume.', 'Sortie (output)|La réponse, avec un pourcentage. Ici : chat ou chien.'],\n      poids: ['Le principe|Un poids dit combien un critère compte, comme un bouton de volume.', 'À grande échelle|Un modèle a des milliards de poids. Chaque poids est un paramètre ; avec les biais (un par neurone), ils forment tous ses paramètres.', 'Dans un réseau|Chaque trait entre deux neurones est un poids : son épaisseur, c’est son importance.', 'L’entraînement|Apprendre, c’est régler tous ces boutons jusqu’à ce qu’il décide juste.'],\n      finetuning: ['Le point de départ|Un modèle généraliste sait faire beaucoup de choses, mais sans finesse.', 'Le fine-tuning|Un petit entraînement en plus, avec quelques exemples d’une tâche précise.', 'Le résultat|Il change le style et les réflexes. Pas les connaissances : pour ça, il faut le RAG.'],\n      rag: ['Le problème|Un LLM ne connaît que ce qu’il a appris : rien de récent, rien sur votre entreprise.', 'La solution|Le RAG le branche sur vos documents. Il les lit avant de répondre.', 'Le résultat|Des réponses à jour, qui s’appuient sur vos vraies données.'],\n      embedding: ['Le problème|Pour un ordinateur, « chat » et « chien » ne sont que des lettres.', 'La solution|Chaque mot devient un point sur une carte. Les mots de sens proche sont voisins.', 'Le résultat|L’IA peut mesurer si deux idées se ressemblent : c’est ainsi qu’elle « comprend » le sens.'],\n      transformer: ['Le problème (avant 2017)|Les IA lisaient mot par mot. Sur une longue phrase, elles oubliaient le début, et leur entraînement était extrêmement lent.', 'La solution : le transformer|Le transformer est la pièce maîtresse des LLM : c’est le « T » de GPT. Il lit toute la phrase d’un coup, puis regarde comment chaque mot se rattache aux autres. Ce mécanisme s’appelle l’« attention ».', 'Des liens plus ou moins forts|Chaque mot répartit 100 % de son attention entre les autres. Dans la phrase du chat, « il » donne environ 70 % à « chat », 15 % à « souris », presque rien au reste. Ces liens sont recalculés à chaque phrase : ils dépendent du contexte.', 'Ce que le LLM y gagne|Il comprend à qui renvoie « il » et garde le fil d’un long texte. Il devine donc mieux le mot suivant.', 'Pourquoi ça a tout changé|Tout est lu en même temps. On a pu entraîner sur des milliards de textes, avec des milliers de puces : ce changement d’échelle a créé les LLM.'],\n      llmmot: ['Le principe|Pour chaque mot possible, le LLM calcule ses chances d’être le suivant.', 'Mot après mot|Il en choisit un, l’ajoute, et recommence. Il ne connaît pas la phrase à l’avance.', 'Ce que ça explique|Une réponse fluide n’est pas forcément vraie : c’est la suite la plus probable.'],\n      jev: ['Le problème|Un LLM rédige, même quand un logiciel n’a besoin que d’un oui ou d’un choix. C’est lent et cher.', 'La solution : Jev|Il ne fait que décider : un choix, un oui/non, un pourcentage. Plus rapide, bien moins cher.', 'Avec un LLM|Jev trie et décide, puis le LLM rédige si besoin. Par exemple : trier un email, modérer un commentaire, noter un prospect.'],\n      worldmodel: ['Le problème|Un LLM connaît le monde par les mots. Il ne « sait » pas vraiment qu’un verre poussé tombe.', 'La solution|Un world model apprend la physique en regardant des vidéos. Il devine l’image suivante du monde.', 'Pourquoi c’est dur|Le monde réel est infini. Une petite erreur grossit à chaque image.', 'À quoi ça sert|Robots, voitures autonomes, jeux vidéo créés en direct. Il ne remplacera pas les LLM : l’un parle, l’autre agit.', 'Où en est la tech (sept. 2026)|Genie 3 (Google), V-JEPA 2 (Meta), Cosmos (NVIDIA). AMI Labs, la start-up de Yann LeCun, a levé 1,03 Md$.'],\n      modeles: ['Le constat|Plusieurs entreprises, dans plusieurs pays, créent leur propre LLM.', 'La conséquence|La même question peut recevoir des réponses différentes selon le modèle.'],\n      interface: ['La confusion|On dit « ChatGPT » pour parler à la fois de l’appli et du modèle.', 'La différence|L’appli, c’est la vitrine où vous tapez. Le modèle, c’est le cerveau derrière.', 'La conséquence|Une même appli peut changer de cerveau.'],\n      usages: ['Le principe|Plus on donne d’autonomie à l’IA, plus elle agit seule.', 'Trois niveaux|Le chatbot répond. L’assistant aide. L’agent agit à votre place.', 'Le revers|Plus elle agit seule, plus il faut la contrôler.'],\n      voyage: ['En résumé|Découper le texte (tokens), situer le sens (embeddings), relier les mots (transformer), calculer (neurones et poids), puis choisir le mot le plus probable.', 'Poids et paramètres|À l’étape Neurones, chaque trait est un poids. Le petit nombre dessus est sa valeur, c’est ce qu’on stocke, un paramètre. Ici une douzaine ; dans un vrai LLM, des milliards.', 'Et les biais ?|Chaque neurone a aussi un biais, un petit nombre qui règle à partir de quand il s’allume. Paramètres = poids + biais.', 'Et ensuite|L’IA ajoute ce mot et recommence tout, mot après mot, jusqu’à la fin de la réponse.'],\n      multimodal: ['Le besoin|Le monde n’est pas fait que de texte : photos, voix, vidéos.', 'Natif|Un seul modèle comprend tout. C’est plus rapide, et il perçoit le ton de la voix.', 'Assemblé|Plusieurs IA se passent le relais. C’est plus lent, et des nuances se perdent en route.'],\n      token: ['Le problème|Un ordinateur ne comprend que les nombres, pas les mots. Pour lui, « chat » n’est qu’une suite de lettres sans signification.', 'La solution|L’IA coupe le texte en tokens : un mot court, une ponctuation ou un morceau de mot long devient un token. En moyenne, un token représente 3 caractères en français, contre 4 en anglais.\\nComment l’IA se souvient-elle d’un token ? Chaque token du vocabulaire de l’IA a un numéro d’identification unique, son ID, défini avant l’entraînement : les mots deviennent ainsi des nombres.', 'Et après|Pendant l’entraînement, l’IA organise tout son dictionnaire sur une carte, en rapprochant les mots de sens proche ou liés logiquement. La position de chaque ID sur cette carte s’appelle son embedding. C’est à partir de là que l’IA analyse les liens entre les mots et choisit le mot suivant.', 'Ce que ça change|Tout se compte en tokens : la longueur de texte que l’IA peut lire d’un coup, sa vitesse, et ce que vous payez.\\nLe français est donc légèrement plus cher et plus lent à traiter pour l’IA que l’anglais.'],\n      parametre: ['Le principe|Les paramètres sont des milliards de petits nombres. C’est là que le modèle garde ce qu’il a appris : la langue, les faits fréquents, les liens entre idées, les manières d’écrire.', 'Comment c’est rangé|Pas un fait par case : le savoir est réparti sur tous les nombres, comme les pixels d’une photo : un pixel seul ne montre rien, c’est l’ensemble qui forme l’image. Les textes eux-mêmes ne sont pas gardés.', 'Plus il y en a|Plus il retient de nuances et de faits rares, mais plus c’est cher à faire tourner. GPT-3 en avait 175 milliards ; pour GPT-6 Astra, OpenAI n’a pas publié le chiffre.'],\n      poids: ['Le principe|Un poids dit combien un critère compte, comme un bouton de volume.', 'Où est-il sur le neurone ?|Un neurone reçoit plusieurs signaux, chacun par un lien (le trait dans le schéma du réseau). Le poids est posé sur ce lien : il dit si le signal arrive fort ou faible.', 'Poids et paramètres|Un poids est un type de paramètre. L’autre type, c’est le biais, le seuil de chaque neurone.', 'L’entraînement|Apprendre, c’est régler tous ces boutons jusqu’à ce que le modèle décide juste.'],\n      transformer: ['Le problème (avant 2017)|Les IA lisaient mot par mot. Sur une longue phrase, elles oubliaient le début, et leur entraînement était extrêmement lent.', 'La solution : le transformer|Le transformer est la pièce maîtresse des LLM : c’est le « T » de GPT. Il lit toute la phrase d’un coup, puis regarde comment chaque mot se rattache aux autres. Ce mécanisme s’appelle l’« attention ».', 'Des liens plus ou moins forts|Chaque mot répartit 100 % de son attention entre les autres. Dans la phrase du chat, « il » donne environ 70 % à « chat », 15 % à « souris », presque rien au reste. Ces liens dépendent du contexte.', 'Pourquoi ça a tout changé|Tout est lu en même temps. On a pu entraîner sur des milliards de textes, avec des milliers de puces : ce changement d’échelle a créé les LLM.'],\n      voyage: ['En résumé|Chaque mot d’une réponse passe par ces 6 étapes, puis tout recommence pour le mot suivant.'],\n      jev: ['Le problème|Un LLM rédige, même quand un logiciel n’a besoin que d’un oui ou d’un choix. C’est lent et cher.', 'La solution : Jev|Il ne fait que décider : un choix, un oui/non, un pourcentage. Plus rapide, bien moins cher.', 'Avec un LLM|Jev trie et décide, puis le LLM rédige si besoin.'],\n      worldmodel: ['Le problème|Un LLM connaît le monde par les mots. Il ne « sait » pas vraiment qu’un verre poussé tombe.', 'La solution|Un world model apprend la physique en regardant des vidéos. Il devine l’image suivante du monde.', 'Pourquoi c’est dur|Le monde réel est infini. Une petite erreur grossit à chaque image.', 'À quoi ça sert|Robots, voitures autonomes, jeux vidéo créés en direct. Il ne remplacera pas les LLM : l’un parle, l’autre agit.'],\n      multimodal: ['Le besoin|Le monde n’est pas fait que de texte : photos, voix, vidéos.', 'La différence|En natif, c’est plus rapide et le modèle perçoit le ton de la voix. En assemblé, chaque relais ralentit et des nuances se perdent.'],\n      token: ['Le problème|Un ordinateur ne comprend que les nombres. Pour lui, « chat » n’est qu’une suite de lettres.', 'La solution|L’IA coupe le texte en petits morceaux, les tokens : un mot court, une ponctuation ou un bout de mot long. Chaque token a son numéro fixe, son ID, attribué avant l’entraînement. Le texte devient ainsi une suite de nombres.', 'Et après|Pendant l’entraînement, l’IA range son dictionnaire sur une carte où les mots proches par le sens sont voisins. La place d’un ID sur cette carte s’appelle son embedding. C’est grâce à elle que l’IA relie les mots et devine le suivant.', 'Ce que ça change|Tout se compte en tokens : ce que l’IA peut lire d’un coup, sa vitesse et votre facture. Un token fait environ 3 caractères (3 octets) en français contre 4 caractères (4 octets) en anglais : le français coûte donc un peu plus cher.']\n    },\n    viz: { tokens: ['Le', 'chat', 'dort', 'sur', 'le', 'ca'], open: 'ouvrir' },\n    terms: [\n      { id: 'token', label: 'Token', def: 'Le texte découpé en morceaux', plain: 'L’IA lit des « tokens », des morceaux de mots. Tapez une phrase pour voir le découpage.' },\n      { id: 'reseau', label: 'Réseau de neurones', def: 'Des neurones reliés en couches', plain: 'Un réseau de neurones reçoit des indices et donne une réponse. Activez-le pour voir le signal passer.' },\n      { id: 'poids', label: 'Poids', def: 'L’importance donnée à chaque signal', plain: 'Le poids dit combien chaque critère compte. Réglez-les et voyez si Titanic est pour vous.' },\n      { id: 'biais', label: 'Biais', def: 'Le seuil d’allumage d’un neurone', plain: 'Le biais dit à partir de quand un neurone s’allume. Réglez-le pour qu’il reconnaisse les chats.' },\n      { id: 'transformer', label: 'Transformer', def: 'Il lit toute la phrase d’un coup', plain: 'Le transformer relie les mots qui vont ensemble, même éloignés. Cliquez le mot qui clignote.' },\n      { id: 'parametre', label: 'Paramètre', def: 'Un réglage interne, parmi des milliards', plain: 'C’est là que le modèle range ce qu’il sait. Poussez le curseur pour en ajouter.' },\n      { id: 'embedding', label: 'Embedding', def: 'Le sens transformé en coordonnées', plain: 'Chaque mot devient un point ; les sens proches sont voisins. Cliquez un mot.' },\n      { id: 'temperature', label: 'Température', def: 'Le curseur créativité', plain: 'La température règle la prise de risque. Bougez le curseur et regardez les chances changer.' },\n      { id: 'prompt', label: 'Prompt', def: 'Ce qu’on lui écrit', plain: 'Plus le prompt est précis, meilleure est la réponse. Ajoutez des infos et regardez.' },\n      { id: 'fenetre', label: 'Fenêtre de contexte', def: 'Ce qu’elle lit d’un coup', plain: 'Sa mémoire de travail est limitée. Faites avancer la conversation et regardez le début s’effacer.' },\n      { id: 'voyage', label: 'Le voyage d’une phrase', def: 'Tout relier, du token au mot suivant', plain: 'Suivez une phrase à travers toutes les étapes, jusqu’au mot que l’IA choisit.' },\n      { id: 'llmmot', label: 'LLM', def: 'Il devine le mot suivant', plain: 'Un LLM écrit un mot à la fois, en devinant le plus probable. Écrivez une phrase avec lui.' },\n      { id: 'llm', label: 'IA / LLM', def: 'Du plus large au plus précis', plain: 'Un LLM est une sorte d’IA. Parcourez les niveaux, du plus large au plus précis.' },\n      { id: 'jev', label: 'Jev', def: 'Une IA qui décide, sans écrire', plain: 'Jev n’écrit pas : il choisit une réponse prévue, avec un pourcentage. Testez ses trois façons de répondre.' },\n      { id: 'worldmodel', label: 'World model', def: 'Une IA qui imagine la suite du monde', plain: 'Un world model prévoit ce qui va se passer dans le monde réel. Choisissez une action.' },\n      { id: 'modeles', label: 'Claude, ChatGPT, Mistral…', def: 'Les grands LLM du marché', plain: 'Des LLM concurrents, du monde entier. Cliquez un modèle, ou une ville sur le globe.' },\n      { id: 'interface', label: 'Modèle vs Interface', def: 'L’appli n’est pas le cerveau', plain: 'L’interface est l’appli où vous tapez. Le modèle est le cerveau derrière. Cliquez pour comparer.' },\n      { id: 'usages', label: 'Chatbot, Assistant, Agent', def: 'Trois degrés d’autonomie', plain: 'Du chatbot qui répond à l’agent qui agit seul. Choisissez un niveau.' },\n      { id: 'finetuning', label: 'Fine-tuning', def: 'Un entraînement d’appoint', plain: 'Le fine-tuning spécialise un modèle pour une tâche. Regardez le robot, puis choisissez le ton du LLM.' },\n      { id: 'rag', label: 'RAG', def: 'Aller chercher la bonne info', plain: 'Le RAG branche l’IA sur une source à jour. Branchez-la et comparez la réponse.' },\n      { id: 'multimodal', label: 'Multimodal', def: 'Pas seulement du texte', plain: 'Un modèle multimodal comprend aussi l’image et le son. Apprenez-lui chaque sens.' }\n    ],\n    sims: {\n      biais: { title: 'Le neurone « chat » doit s’allumer pour les chats, pas pour le chien. Réglez son biais :', ctlLbl: 'Biais', ctlSub: 'le seuil à partir duquel le neurone s’allume', sigLbl: 'Signal reçu par le neurone', thrLbl: '| = le seuil', ex: [{ ic: '🐱', n: 'Chat net', v: 80 }, { ic: '🐈', n: 'Chat flou', v: 50 }, { ic: '🐶', n: 'Chien', v: 25 }], on: 'allumé', off: 'éteint', low: 'Biais trop bas : il s’allume même pour le chien.', high: 'Biais trop haut : il rate le chat flou.', none: 'Biais beaucoup trop haut : il ne s’allume plus du tout.', ok: 'Bien réglé : il s’allume pour les deux chats, pas pour le chien.' },\n      voyage: { bHint: 'Le biais, c’est le seuil du neurone, quand l’anneau est plein, il envoie son signal.', eq1: 'Poids', eq1s: 'chaque trait', eq2: 'Biais', eq2s: 'le seuil de chaque neurone', eq3: 'Paramètres', wLbl4: 'b = un biais : un par neurone, aussi un paramètre', wLbl3: 'un poids = un paramètre', wLbl1: 'ce trait = un poids', wLbl2: 'son nombre = un paramètre', wLbl: 'trait = un poids · son nombre = un paramètre', title: 'Suivez la phrase « Le chat dort sur le… » jusqu’au mot suivant :', words: ['Le', 'chat', 'dort', 'sur', 'le'], next: 'canapé', steps: [['Token', 'On part de la phrase « Le chat dort sur le… ». L’IA la découpe en tokens, et chacun reçoit son ID, un numéro fixe, le texte devient une suite de nombres. Reste à trouver le dernier, celui qui manque.', 'token'], ['Embedding', 'Un numéro seul ne dit rien du sens. Chaque ID reçoit donc sa place sur la carte des sens, plus un mot est bleu foncé, plus il est lié à la phrase ; en gris, aucun lien.', 'embedding'], ['Transformer', 'Les mots ont leur sens, mais ne se parlent pas encore. Le transformer les fait se regarder, chaque mot répartit son attention entre les autres. « dort » se lie fortement à « chat », c’est lui qui dort.', 'transformer'], ['Neurones', 'Enrichis par ces liens, les mots traversent des couches de neurones. Chaque trait est un poids, chaque neurone a son seuil, le biais. Ensemble, ce sont les paramètres réglés pendant l’entraînement.', 'reseau'], ['Probabilités', 'À la sortie des neurones, chaque mot du dictionnaire reçoit ses chances d’être le suivant. Grâce au contexte (« chat », « dort », « sur le »), « canapé » arrive en tête.', 'llmmot'], ['Le mot sort', 'L’IA choisit « canapé » et l’ajoute à la phrase. Puis tout recommence depuis l’étape 1, avec « Le chat dort sur le canapé », pour trouver le mot d’après.', 'llmmot']], cands: [['canapé', 60], ['tapis', 25], ['lit', 12], ['vélo', 3]], emb: [['Le', 40, 112], ['chat', 205, 42], ['dort', 238, 88], ['sur', 105, 78], ['le', 62, 132], ['chien', 250, 22, .9], ['chaton', 168, 26, .85], ['sommeil', 272, 104, .7], ['lit', 226, 128, .6], ['canapé', 150, 122, .55], ['sous', 132, 96, .5], ['un', 20, 92, .35], ['voiture', 272, 58, 0], ['banane', 100, 18, 0], ['impôt', 292, 140, 0], ['nuage', 40, 40, 0]], netLbl: '≈ des milliards de paramètres', more: 'Voir en détail →', nextBtn: 'Étape suivante →', prevBtn: '← Précédente', again: '↺ Recommencer' },\n      reseau: { wLbl: 'trait = un poids · son nombre = un paramètre', zoomLbl: 'Zoom sur un neurone du milieu', thrLbl: 'seuil (biais)', fire: '⚡ il s’allume et transmet', idle2: 'Une photo arrive : le réseau doit dire si c’est un chat ou un chien.', title2: 'Le signal traverse les neurones, de l’entrée à la sortie :', inHdr: 'Entrée', hidHdr: 'Neurones', outHdr: 'Sortie', inLbls: ['🐾 Moustaches', '👂 Oreilles pointues'], outLbls: ['🐱 Chat', '🐶 Chien'], res2: 'Verdict : c’est un chat, à 92 %.', title: 'Activez le réseau : le signal traverse les couches.', go: '⚡ Propager le signal', stop: 'Réinitialiser', legend: 'point = neurone · trait = connexion (poids)', noteOff: 'Au repos. Cliquez pour envoyer un signal.', noteOn: 'Le signal traverse les couches et ressort transformé à droite.' },\n      poids: { criteria2: [{ name: 'Action', val: 65 }, { name: 'Humour', val: 20 }, { name: 'Suspense', val: 85 }], ctlLbl: 'Vos réglages', ctlSub: 'l’importance de chaque critère', resLbl: 'Résultat', resSub: 'ce que l’IA décide', title: '🎬 Titanic est-il fait pour vous ? Réglez l’importance de chaque critère :', ctx: 'Votre IA doit juger : ce film est-il fait pour vous ? Chaque critère a une note ; le poids dit combien il compte dans la décision.', importance: 'poids', criteria: [{ name: 'Action', val: 70 }, { name: 'Humour', val: 90 }, { name: 'Suspense', val: 55 }], gauge: 'Score du film', reco: 'À regarder !', avoid: 'À zapper, score trop faible', note: 'Le poids est comme un bouton de volume : il règle combien chaque critère « parle » dans la décision. Un modèle a des milliards de poids ; l’entraîner, c’est tourner tous ces boutons pour qu’il décide juste.' },\n      llmmot: { pickLbl: '👇 À vous : cliquez le mot suivant', what: 'Ce que fait le LLM : pour chaque mot possible, il calcule une probabilité d’être le suivant. Il en choisit un, l’ajoute, puis recommence, jusqu’à la fin de la réponse. Il ne « sait » pas la phrase à l’avance.', title: 'Le LLM calcule les chances de chaque mot suivant, puis en tire un au sort :', spinning: 'Le LLM choisit…', start: 'Ce matin, j’ai bu un', steps: [[['café', 64], ['thé', 33], ['éléphant', 3]], [['bien chaud', 58], ['trop sucré', 38], ['fluo', 4]], [['avant', 55], ['pendant', 41], ['en dansant', 4]], [['le travail.', 61], ['la réunion.', 36], ['la fin du monde.', 3]]], auto: '🎰 Générer le mot suivant', again: '↺ Nouvelle phrase', odd: '😄 Choix improbable ! Le LLM l’aurait rarement pris.', done: 'Phrase terminée ! Un LLM écrit toutes ses réponses comme ça.' },\n      llm: { title: 'Cliquez du plus large au plus précis :', hint: 'Cliquez un niveau pour voir sa définition.', layers: [{ label: 'IA, Intelligence artificielle', def: 'La famille la plus large : tout programme qui imite une capacité humaine.' }, { label: 'Apprentissage automatique (machine learning)', def: 'Une IA qui apprend avec des exemples, au lieu de suivre des règles écrites à la main.' }, { label: 'LLM, Grand modèle de langage', def: 'Spécialisé dans le langage : il prédit le mot suivant. Ex. Claude, ChatGPT.' }, { label: 'Jev, IA qui décide', def: 'Voisin du LLM, qui décide au lieu d’écrire.' }] },\n      jev: { title: 'Jev répond de trois façons. Choisissez-en une, puis un exemple :', resLbl: 'Décision de Jev', yes: 'Oui', no: 'Non', sure: 'sûr à', modes: [\n        { k: 'Choix', sub: 'une option parmi plusieurs', ic: '✉️', q: 'Quel service doit traiter cet email ?', items: [{ t: 'Je n’ai toujours pas reçu ma facture de septembre.', o: [['Facturation', 86], ['Technique', 6], ['Commercial', 8]] }, { t: 'Troisième bug ce mois-ci, l’appli plante encore.', o: [['Facturation', 5], ['Technique', 81], ['Commercial', 14]] }, { t: 'Je voudrais un devis pour 3 postes supplémentaires.', o: [['Facturation', 7], ['Technique', 3], ['Commercial', 90]] }] },\n        { k: 'Oui / non', sub: 'une réponse tranchée', ic: '💬', q: 'Peut-on publier ce commentaire ?', items: [{ t: 'Super article, merci pour ces conseils clairs !', y: 97 }, { t: 'Arnaque totale, ces gens sont des escrocs, fuyez !!!', y: 14 }, { t: 'Gagnez 5 000 € par mois sans rien faire, cliquez ici.', y: 3 }] },\n        { k: 'Probabilité', sub: 'un pourcentage de chance', ic: '👤', q: 'Quelle chance que ce prospect signe ?', items: [{ t: 'A demandé une démo, ouvert 2 relances, budget validé.', r: 78 }, { t: 'A téléchargé un guide, aucune réponse depuis.', r: 21 }, { t: 'A signé chez un concurrent le mois dernier.', r: 4 }] }\n      ], whyLbl: 'Comprendre Jev', why: [\n        { h: 'Pourquoi Jev ?', t: 'Un LLM écrit du texte, même quand un logiciel a juste besoin d’une décision. Jev ne rédige rien : il tranche vite, avec une probabilité exploitable.' },\n        { h: 'À quoi ça sert', t: 'Trier, classer, filtrer, évaluer un risque : les milliers de petites décisions d’une entreprise, pour bien moins cher qu’un LLM.' },\n        { h: 'Quand l’utiliser', t: 'Router un email ou un ticket, noter un prospect, valider l’action d’un agent IA, décider s’il faut passer la main à un humain.' },\n        { h: 'Avec un LLM', t: 'Jev décide d’abord, le LLM rédige ensuite si besoin. Le réflexe rapide d’un côté, l’écriture de l’autre.' }\n      ], flow: ['✉️ Message', '⚡ Jev décide', '✍️ Le LLM rédige'] },\n      worldmodel: { legPred: 'Prédit par le modèle', legReal: 'Ce qui se passe vraiment', why: [\n        { h: 'Pourquoi c’est difficile', t: 'Le monde réel est infini : lumière, frottements, objets cachés. Le modèle doit rester cohérent image après image, et une petite erreur grossit vite.' },\n        { h: 'Mieux qu’un LLM ?', t: 'Pas mieux, différent. Un LLM connaît le monde par les mots. Un world model le connaît par l’expérience visuelle : il sait qu’un verre poussé tombe, sans l’avoir lu.' },\n        { h: 'Cas d’usage', t: 'Robots qui manipulent des objets, voitures autonomes qui anticipent, jeux vidéo générés en direct, entraînement sur des mondes simulés.' },\n        { h: 'Remplacera les LLM ?', t: 'Peu probable. Ils se complètent : le LLM pour parler et raisonner avec des mots, le world model pour agir dans le monde physique.' }\n      ], title: 'Choisissez une action : le world model imagine la suite avant qu’elle arrive.', hint: 'Choisissez une action', imagining: 'Il imagine la suite…', real: '✓ Prédiction juste', acts: [\n        { btn: '🥛 Pousser le verre', o: '🥛', endO: '💥', pred: 'Il va glisser, tomber et se briser.', path: [[140, 70], [160, 70], [176, 96], [186, 128]] },\n        { btn: '⚽ Lâcher la balle', o: '⚽', pred: 'Ell s de la fenêtre (toute la conversation) plus le nouveau message. Quand la fenêtre est pleine, les plus anciens tokens sortent, le modèle les oublie. La fenêtre de contexte, c’est ce nombre maximum de tokens qu’il peut garder en tête.', turns: [{ who: 'user', text: 'Bonjour, je prépare un voyage.' }, { who: 'ai', text: 'Super, vous partez où ?' }, { who: 'user', text: 'À Rome, en avril.' }, { who: 'ai', text: 'Parfait, une belle saison !' }, { who: 'user', text: 'Rappelez-moi ma destination ?' }] },\n      parametre: { pModes: [['Combien ?', 'la taille du modèle'], ['Comment il apprend ?', 'l’entraînement']], trTitle: 'Le modèle doit compléter : « La capitale de la France est… »', trParams: 'Paramètres dans le modèle', trGuess: 'Sa réponse', trErr: 'Erreur', trBtn: '▶ Corriger une fois', trAgain: '↺ Recommencer', words: ['Paris', 'banane', 'Lyon', 'bleu'], trSteps: ['Au départ, ses paramètres sont réglés au hasard : il répond n’importe quoi.', 'On mesure son erreur, puis chaque paramètre bouge un tout petit peu vers « Paris ».', 'On recommence : « Paris » gagne du terrain.', 'Encore une correction… l’erreur fond.', '✓ Ses paramètres « savent » maintenant que c’est Paris. Répété des milliards de fois, c’est ça, l’entraînement.'], title: 'Combien de paramètres donner au modèle ?', few: 'peu', many: 'beaucoup', gauge: 'Nuances', noteLow: 'Peu de paramètres : réponses grossières.', noteMid: 'Assez de paramètres : déjà pas mal de nuances.', noteHigh: 'Beaucoup de paramètres : nuances fines, mais coût élevé.', race: { t: 'La course aux paramètres', b: 'C’est l’argument que tous les créateurs de modèles mettent en avant : chaque nouveau modèle annonce son nombre de paramètres. On est passé de quelques millions à des centaines de milliards (GPT-3 en revendiquait 175 milliards), et certains évoquent déjà des milliers de milliards. Plus de paramètres = plus de nuances possibles, mais un coût d’entraînement et de calcul bien plus lourd, d’où la tendance récente à miser autant sur la qualité des données que sur la taille.' } },\n      finetuning: { title2: 'Même modèle, avec ou sans fine-tuning :', robWithout: 'Sans fine-tuning', robWith: 'Avec fine-tuning', robKo: 'Généraliste, le robot sait verser, mais il ne connaît pas ce verre : il déborde.', robOk: 'Après quelques exemples ciblés, il s’arrête au bon niveau.', demoLbl: 'Démo : regardez le robot', gameLbl: 'À vous de jouer : réglez le LLM', prompt: 'Confirme au client son rendez-vous de mardi.', styles: [\n        { l: 'Sans', a: 'Votre rendez-vous est mardi.', n: 'Le modèle généraliste répond juste, mais sans ton ni contexte métier.' },\n        { l: 'Pro', a: 'Bonjour Monsieur Martin, je vous confirme notre rendez-vous de mardi à 14 h au cabinet. Je reste à votre disposition d’ici là. Bien cordialement.', n: 'Fine-tuné sur des mails de cabinet : formules, précision, vouvoiement.' },\n        { l: 'Chaleureux', a: 'Bonjour Jean ! C’est noté pour mardi 14 h, j’ai hâte d’échanger avec vous. Une question d’ici là ? Écrivez-moi. À très vite !', n: 'Fine-tuné sur des échanges plus proches : même info, ton différent.' }\n      ], title: 'Le robot du simu n°2, spécialisé par fine-tuning :', btnOff: 'Fine-tuning', btnOn: 'Fine-tuning', before: { pre: 'Le robot attrape le flacon ', chip: 'comme un cube', post: ' (prise brutale).', tone: 'red', note: 'Modèle de base : il sait faire, sans finesse.' }, after: { pre: 'Après fine-tuning, il attrape le flacon fragile ', chip: 'tout en douceur', post: '.', tone: 'green', note: 'Quelques démonstrations ont suffi pour spécialiser le geste.' } },\n      rag: { qs: [\n        { tag: '💼 Pro', b: 'Quand a eu lieu le dernier RDV avec M. Martin ?', box: 'CRM du cabinet', docs: ['📇 Fiche CRM · M. Martin', '📝 Notes RDV · 12 sept.', '✉️ Email · relance devis', '📄 Contrat · Mme Durand', '📊 Rapport · T2'], hit: [0, 1], ex: 'Notes RDV du 12 sept. : « RDV au cabinet avec M. Martin, point sur son PER. »', off: 'Le 3 mars, par téléphone.', offBad: true, on: 'Le 12 septembre, au cabinet : vous avez fait le point sur son PER.', src: 'Notes RDV · 12 sept.' },\n        { tag: '🏠 Perso', b: 'À quelle heure part mon train pour Lyon samedi ?', box: 'votre boîte mail', docs: ['✉️ Réservation SNCF', '📅 Agenda · samedi', '🧾 Facture · électricité', '📸 Photos · vacances', '✉️ Newsletter · recettes'], hit: [0, 1], ex: 'Réservation : « Paris Gare de Lyon → Lyon Part-Dieu, samedi 9 h 04, voiture 12. »', off: 'Votre train part à 14 h 30.', offBad: true, on: 'Samedi à 9 h 04, de Paris Gare de Lyon, voiture 12.', src: 'Réservation SNCF' }\n      ], coLbl2: 'Cabinet', coDb: 'CRM à jour', pcLbl: 'Votre PC', pcDb: 'vos mails', plugHint: '👆 Brancher', plugWait: 'Envoyez d’abord une question', pickLbl: '1. Envoyez une question :', ragLbl: '2. RAG :', onLbl: 'Branché', offLbl: 'Débranché', send: '➤ Envoyer', again: '↺ Renvoyer', docsLbl: 'Vos documents', searching: '', reading: '', found: '', memory: '🧠 De mémoire…', nothing: 'Rien d’utile trouvé.', srcLbl: 'Source :', vBad: '❌ Inventé : sans documents, il répond de mémoire.', vMem: '✅ Juste : culture générale.', vOn: '✅ Juste et sourcé : même modèle, avec les bonnes pages.', vUseless: '👌 Rien d’utile : le RAG ne sert pas ici.', title: 'Même question, avec ou sans vos documents :',\n        title_old: 'Une entreprise branche sa source au LLM :', btnOff: 'Brancher la source (RAG)', btnOn: 'Débrancher', coLbl: 'Entreprise', dbLbl: 'sa base à jour', noteOff: 'Débranché : le LLM répond de mémoire. Sur une info récente ou interne, il peut se tromper.', noteOn: 'Branché : il lit la base de l’entreprise avant de répondre. Réponse à jour et fiable.' },\n      embedding: { tip: '👆 Cliquez un mot', title: 'Chaque mot devient un point : les sens proches sont voisins.', cats: [{ label: 'Animaux', color: '#ff9d4d' }, { label: 'Technologie', color: '#4d8bff' }, { label: 'Nourriture', color: '#35c26a' }, { label: 'Espace', color: '#b06cff' }], points: [{ label: 'Chat', c: 0, x: 15, y: 15 }, { label: 'Chien', c: 0, x: 34, y: 25 }, { label: 'Loup', c: 0, x: 11, y: 36 }, { label: 'Lion', c: 0, x: 33, y: 44 }, { label: 'Python', c: 1, x: 65, y: 13 }, { label: 'Code', c: 1, x: 88, y: 22 }, { label: 'Logiciel', c: 1, x: 63, y: 38 }, { label: 'Vecteur', c: 1, x: 90, y: 47 }, { label: 'Pomme', c: 2, x: 13, y: 64 }, { label: 'Orange', c: 2, x: 31, y: 76 }, { label: 'Banane', c: 2, x: 12, y: 88 }, { label: 'Festin', c: 2, x: 36, y: 66 }, { label: 'Étoile', c: 3, x: 60, y: 60 }, { label: 'Galaxie', c: 3, x: 87, y: 68 }, { label: 'Orbite', c: 3, x: 70, y: 86 }, { label: 'Photon', c: 3, x: 85, y: 54 }], hint: 'Cliquez un mot : on relie ses voisins de sens (même couleur = même famille).', nearestLbl: 'Plus proches de', nearestEnd: 'Sens voisins → points voisins.' }\n    }\n  },\n  en: {\n    eyebrow: 'Teaching simulator · glossary',\n    title: 'The words of AI, decoded',\n    disc: 'Teaching simulator: it illustrates concepts and deliberately simplifies how an AI really works.',\n    welcome: { intro: 'Hello! We hear these words about AI all the time. Click each one: it opens a little simulator to understand it by playing with it.', cta: 'Explore the words →' },\n    guideIntro: 'Click a word: I open a mini-simulator above so you can test it yourself.',\n    robotLine: 'Beep boop… You caught me: I’m an LLM dressed up as Einstein. I just guess the next word, but really well. 😉',\n    panelKicker: 'Mini-simulator',\n    groups: { all: { label: 'All', sub: '' }, bases: { label: 'The basics', sub: 'what an AI is made of' }, regler: { label: 'Tuning the model', sub: 'what drives its answers' }, paysage: { label: 'The landscape', sub: 'brands, apps and uses' }, autres: { label: 'Types of models', sub: 'LLMs and other AI approaches' } },\n    searchPh: 'Search a term…', noResult: 'No term for',\n    tryLbl: 'try', resetLbl: 'Reset', synLbl: 'Wrap-up · linking it all',\n    simpleLbl: 'In short', simple: {\n      biais: ['The idea|The bias is a neuron’s threshold: the incoming signal must exceed it for the neuron to fire.', 'Where is it?|A weight sits on each incoming link. The bias sits on the neuron itself: one bias per neuron.', 'Weights and parameters|The bias is the other type of parameter, alongside the weight. Parameters = weights + biases.', 'Training|Like weights, biases are tuned during training until each neuron fires at the right moment.'],\n      token: ['The problem|A computer only understands numbers, not words. To it, “cat” is just a string of letters with no meaning.', 'The solution|AI splits text into tokens: a short word is one token, a long word is several. Every token in the vocabulary has a unique identification number, its ID, set before training: words become numbers.', 'Next|Each ID gets an embedding, its place on a map of meanings, learned during training. That’s what lets the AI understand the sentence and pick the next word.', 'What it changes|Everything is counted in tokens: how much text the AI can read at once, its speed, and what you pay.'],\n      temperature: ['Low: the AI takes the safest word.', 'High: it dares rare words, sometimes brilliant, sometimes absurd.'],\n      prompt: ['The prompt is what you write to the AI. It’s all it has to understand you.', 'Role + examples + format = a far better answer.'],\n      fenetre: ['With each message, the AI re-reads the whole conversation.', 'But its memory has a size limit: the window.', 'When it’s full, the start is forgotten. If “Rome” had dropped out, it couldn’t answer.'],\n      parametre: ['Parameters are the model’s internal settings.', 'More of them = more nuance, but a higher cost.', 'GPT-3 had 175 billion. The biggest have trillions.'],\n      reseau: ['Input|What the network receives: here, clues spotted on the photo.', 'Neuron|A tiny calculator. It adds up the signals it gets, weighted (thick lines = important), and lights up if the total is strong enough.', 'Output|The network’s answer, with a probability: here, cat or dog.'],\n      poids: ['A weight is a volume knob: it says how much a criterion counts.', 'A model has billions of weights.', 'Training it means turning all those knobs until it decides right.'],\n      finetuning: ['A small extra training for a specific task.', 'It changes style and reflexes, not knowledge.'],\n      rag: ['RAG plugs the AI into your documents.', 'It reads them before answering: up-to-date answers, on your real data.'],\n      embedding: ['Each word becomes a point on a map.', 'Close meanings = neighbouring points. That’s how AI “gets” meaning.'],\n      transformer: ['The problem before (pre-2017)|AI read word by word, in single file. By the end of a long sentence, it had forgotten the start. And it was slow to train.', 'The transformer|It reads the whole sentence at once and links each word to the others: that’s “attention”. It’s the “T” in GPT.', 'What the LLM gets from it|It knows who “it” refers to, spots what matters and keeps track of a long text. That context is what helps it guess the next word well.', 'Why it changed everything|Everything is read in parallel: models could be trained on billions of texts, with thousands of chips at once. That jump in scale gave birth to LLMs.'],\n      llmmot: ['For every possible word, the LLM computes a probability.', 'It picks one, adds it, then starts again.', 'It doesn’t know the sentence in advance.'],\n      jev: ['Why Jev|An LLM writes text. Jev only decides: faster, far cheaper.', 'When to use it|Sort an email, moderate a comment, score a lead, approve an agent’s action.', 'With an LLM|Jev decides first, the LLM writes afterwards if needed.'],\n      worldmodel: ['The idea|An LLM predicts the next word. A world model predicts the next frame of the world.', 'Why it’s hard|The real world is endless, and a small error grows frame after frame.', 'Uses|Robots, self-driving cars, video games generated live.', 'Will it replace LLMs?|No, they complement each other: one talks, the other acts.', 'Where the tech stands (Sept. 2026)|Genie 3 (Google), V-JEPA 2 (Meta), Cosmos (NVIDIA). AMI Labs, Yann LeCun’s start-up, raised $1.03B.'],\n      modeles: ['Competing LLMs, made by different companies.', 'The same question can get different answers depending on the model.'],\n      interface: ['The app is the shop window. The model is the brain behind it.', 'The same app can switch brains.'],\n      usages: ['The more autonomous the AI, the more it acts alone.', 'The chatbot answers, the assistant helps, the agent does it for you.'],\n      voyage: ['In short|Split the text (tokens), place the meaning (embeddings), link the words (transformer), compute (neurons and weights), then pick the most likely word.', 'Then|The AI adds that word and starts it all again, word after word, until the answer ends.'],\n      multimodal: ['Native|One model directly understands text, image and sound. Faster, and it picks up the tone of voice.', 'Chained|Several specialised AIs pass the baton. Slower, and nuances get lost along the way.'],\n      token: ['The problem|A computer only understands numbers. To it, “cat” is just a string of letters.', 'The solution|AI cuts the text into small pieces, tokens: a short word, a punctuation mark or part of a long word. Each token has a fixed number, its ID, set before training. The text becomes a string of numbers.', 'Next|During training, the AI lays out its dictionary on a map where words close in meaning sit side by side. An ID’s place on that map is called its embedding. That’s how the AI links words and guesses the next one.', 'What it changes|Everything is counted in tokens: how much the AI can read at once, its speed and your bill. A token is about 4 characters in English versus 3 in French, so French costs a little more.'],\n      temperature: ['The fact|For each word, the AI has several candidates, more or less likely.', 'The setting|Low, it always takes the safest one. High, it dares rare words.', 'In practice|Low for a contract or a calculation. High to look for ideas.'],\n      prompt: ['The problem|The AI knows nothing about you or your need.', 'The solution|The prompt gives it everything: a role, an example, the format you want.', 'The result|The more precise the prompt, the more accurate the answer.'],\n      fenetre: ['The principle|With each message, the AI re-reads the whole conversation.', 'The limit|Its memory has a maximum size: the window. When it’s full, the start is forgotten.', 'The consequence|If “Rome” had dropped out of the window, it could no longer answer you.'],\n      parametre: ['The principle|Parameters are billions of small numbers. That’s where the model keeps what it learned: language, common facts, links between ideas, ways of writing.', 'How it’s stored|Not one fact per box: knowledge is spread over all the numbers, like a recipe in the taste of a dish. The texts themselves aren’t kept.', 'The more there are|The more nuance and rare facts it keeps, but the more it costs to run. GPT-3 had 175 billion; for GPT-6 Astra, OpenAI hasn’t published the figure.'],\n      reseau: ['Input|What the network receives. Here: clues seen on the photo.', 'Neuron|A mini-calculation. It adds up what it receives, taking the weights into account (thick line = important). If the total passes its threshold, it lights up. That threshold is set by another parameter, the bias.', 'Output|The answer, with a percentage. Here: cat or dog.'],\n      poids: ['The principle|A weight says how much a criterion counts, like a volume knob.', 'Training|Learning means adjusting all these knobs until the model decides right.'],\n      finetuning: ['The starting point|A general model can do many things, but without finesse.', 'Fine-tuning|A small extra training, with a few examples of a specific task.', 'The result|It changes style and reflexes. Not knowledge: for that, you need RAG.'],\n      rag: ['The problem|An LLM only knows what it learned: nothing recent, nothing about your company.', 'The solution|RAG plugs it into your documents. It reads them before answering.', 'The result|Up-to-date answers, based on your real data.'],\n      embedding: ['The problem|To a computer, “cat” and “dog” are just letters.', 'The solution|Each word becomes a point on a map. Words close in meaning are neighbours.', 'The result|The AI can measure whether two ideas are alike: that’s how it “understands” meaning.'],\n      transformer: ['The problem (before 2017)|AIs read word by word. On a long sentence they forgot the start, and training was extremely slow.', 'The solution: the transformer|It reads the whole sentence at once and links each word to the others: that’s “attention”. It’s the “T” in GPT, the key piece of LLMs.', 'Stronger or weaker links|Each word shares 100% of its attention among the others. In the cat sentence, “it” gives about 70% to “cat”, 15% to “mouse”, almost nothing to the rest. These links depend on context.', 'Why it changed everything|Everything is read at the same time. Models could be trained on billions of texts, with thousands of chips: that change of scale created LLMs.'],\n      llmmot: ['The principle|For every possible word, the LLM computes its chance of being next.', 'Word after word|It picks one, adds it, and starts again. It doesn’t know the sentence in advance.', 'What it explains|A fluent answer isn’t necessarily true: it’s the most likely continuation.'],\n      jev: ['The problem|An LLM writes, even when software only needs a yes or a choice. That’s slow and expensive.', 'The solution: Jev|It only decides: a choice, a yes/no, a percentage. Faster, far cheaper.', 'With an LLM|Jev sorts and decides, then the LLM writes if needed.'],\n      worldmodel: ['The problem|An LLM knows the world through words. It doesn’t really “know” that a pushed glass falls.', 'The solution|A world model learns physics by watching videos. It guesses the next frame of the world.', 'Why it’s hard|The real world is endless. A small error grows with every frame.', 'What it’s for|Robots, self-driving cars, video games created live. It won’t replace LLMs: one talks, the other acts.'],\n      modeles: ['The fact|Several companies, in several countries, build their own LLM.', 'The consequence|The same question can get different answers depending on the model.'],\n      interface: ['The confusion|People say “ChatGPT” for both the app and the model.', 'The difference|The app is the shop window where you type. The model is the brain behind it.', 'The consequence|The same app can switch brains.'],\n      usages: ['The principle|The more autonomy you give the AI, the more it acts on its own.', 'Three levels|The chatbot answers. The assistant helps. The agent acts for you.', 'The downside|The more it acts alone, the more it needs checking.'],\n      voyage: ['In short|Every word of an answer goes through these 6 steps, then it all starts again for the next word.'],\n      multimodal: ['The need|The world isn’t just text: photos, voices, videos.', 'The difference|Native is faster and the model picks up the tone of voice. Chained, each relay slows things down and nuances get lost.']\n,\n      token: ['The problem|A computer only understands numbers. To it, “cat” is just a string of letters.', 'The solution|AI cuts the text into small pieces, tokens: a short word, a punctuation mark or a chunk of a long word. Each token has a fixed number, its ID, set before training. The text becomes a sequence of numbers.', 'Then|During training, the AI arranges its dictionary on a map where words close in meaning are neighbours. An ID’s place on this map is its embedding. That’s how the AI links words and guesses the next one.', 'What it changes|Everything is counted in tokens: what the AI can read at once, its speed and your bill. A token is about 4 characters (4 bytes) in English versus 3 characters (3 bytes) in French: French costs a little more.'],\n      reseau: ['Input|What the network receives. Here: clues spotted on the photo.', 'Neuron|A tiny calculation. It receives the clues, but doesn’t listen to them all equally: some count more than others, that’s their weight (thick line = important clue). It adds them up. If the total exceeds its threshold, it lights up. That threshold is called the bias.', 'Weights and biases|These are the two types of parameters. A weight sits on each link and says whether a signal arrives strong or weak. A bias sits on the neuron itself and sets when it lights up.', 'Output|The answer, with a percentage. Here: cat or dog.'],\n      parametre: ['The principle|Parameters are billions of small numbers. That’s where the model keeps what it learned: language, common facts, links between ideas, ways of writing.', 'How it’s stored|No fact per box: knowledge is spread across all the numbers, like the pixels of a photo: one pixel alone shows nothing, it’s the whole that forms the image. The texts themselves aren’t kept.', 'The more there are|The more nuance and rare facts it retains, but the more it costs to run. GPT-3 had 175 billion; for GPT-6 Astra, OpenAI hasn’t published the number.'],\n      poids: ['The principle|A weight says how much a criterion counts, like a volume knob.', 'Where is it on the neuron?|A neuron receives several signals, each through a link (the line in the network diagram). The weight sits on that link: it says whether the signal arrives strong or weak.', 'Weights and parameters|A weight is one type of parameter. The other type is the bias, each neuron’s threshold.', 'Training|Learning means adjusting all these knobs until the model decides right.'],\n      transformer: ['The problem (before 2017)|AIs read word by word. On a long sentence they forgot the start, and training was extremely slow.', 'The solution: the transformer|The transformer is the cornerstone of LLMs: it’s the “T” in GPT. It reads the whole sentence at once, then looks at how each word connects to the others. This mechanism is called “attention”.', 'Stronger or weaker links|Each word splits 100% of its attention among the others. In the cat sentence, “it” gives about 70% to “cat”, 15% to “mouse”, almost nothing to the rest. These links depend on context.', 'Why it changed everything|Everything is read at the same time. Models could be trained on billions of texts, on thousands of chips: that change of scale created LLMs.'],\n      rag: ['The problem|An LLM only knows what it learned: nothing recent, nothing about your company.', 'The solution|RAG plugs it into your documents. It reads them before answering.', 'The result|Up-to-date answers, based on your real data.']\n    },\n    viz: { tokens: ['The', 'cat', 'sle', 'eps', 'on', 'the'], open: 'open' },\n    terms: [\n      { id: 'token', label: 'Token', def: 'Text split into chunks', plain: 'An AI reads “tokens”, pieces of words. Type a sentence to see how it splits.' },\n      { id: 'reseau', label: 'Neural network', def: 'Layers of linked dots', plain: 'A neural network receives clues and gives an answer. Switch it on to watch the signal flow.' },\n      { id: 'poids', label: 'Weight', def: 'The importance given to each signal', plain: 'A weight says how much each criterion counts. Adjust them and see if Titanic is for you.' },\n      { id: 'biais', label: 'Bias', def: 'A neuron’s firing threshold', plain: 'The bias sets when a neuron fires. Tune it so the neuron recognises cats.' },\n      { id: 'transformer', label: 'Transformer', def: 'It reads the whole sentence at once', plain: 'The transformer links words that belong together, even far apart. Click the blinking word.' },\n      { id: 'parametre', label: 'Parameter', def: 'One internal setting, among billions', plain: 'That’s where the model stores what it knows. Push the slider to add more.' },\n      { id: 'embedding', label: 'Embedding', def: 'Meaning turned into coordinates', plain: 'Each word becomes a point; close meanings sit close. Click a word.' },\n      { id: 'temperature', label: 'Temperature', def: 'The creativity dial', plain: 'Temperature sets how much risk the AI takes. Move the slider and watch ugh the links, and comes out transformed on the right. That is how a network “computes”.' },\n      poids: { criteria2: [{ name: 'Action', val: 65 }, { name: 'Humour', val: 20 }, { name: 'Suspense', val: 85 }], ctlLbl: 'Your settings', ctlSub: 'how much each criterion counts', resLbl: 'Result', resSub: 'what the AI decides', title: '🎬 Is Titanic for you? Set how much each criterion counts:', ctx: 'Your AI must judge: is this film for you? Each criterion has a score; the weight says how much it counts in the decision.', importance: 'weight', criteria: [{ name: 'Action', val: 70 }, { name: 'Comedy', val: 90 }, { name: 'Suspense', val: 55 }], gauge: 'Film score', reco: 'Worth watching!', avoid: 'Skip it, score too low', note: 'A weight is like a volume knob: it sets how loudly each criterion “speaks” in the decision. A model has billions of weights; training it means turning all those knobs so it decides well.' },\n      llmmot: { pickLbl: '👇 Your turn: click the next word', what: 'What the LLM does: for every possible word, it computes a probability of being next. It picks one, adds it, then starts again, until the answer ends. It doesn’t “know” the sentence in advance.', title: 'The LLM computes the odds of each next word, then draws one:', spinning: 'The LLM is choosing…', start: 'This morning I drank a', steps: [[['coffee', 64], ['tea', 33], ['elephant', 3]], [['nice and hot', 58], ['way too sweet', 38], ['neon', 4]], [['before', 55], ['during', 41], ['while dancing', 4]], [['work.', 61], ['the meeting.', 36], ['the end of the world.', 3]]], auto: '🎰 Generate the next word', again: '↺ New sentence', odd: '😄 Unlikely pick! The LLM would rarely have chosen it.', done: 'Sentence done. That’s exactly how an LLM writes your answers: word after word, betting on the most likely.' },\n      llm: { title: 'Click from broadest to most precise:', hint: 'Click a level to see its definition.', layers: [{ label: 'AI, Artificial intelligence', def: 'AI: any program that mimics a
